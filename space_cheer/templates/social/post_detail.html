{% extends "social/base_social.html" %}
{% load static i18n %}

{% block social_content %}
<div class="container py-3 py-md-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
      <a href="{% url 'social:feed' %}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1"></i>{% trans "Volver al feed" %}
      </a>
      {% include "social/partials/post_card.html" with show_all_comments=True %}
    </div>
  </div>
</div>

<!-- Modal compartir (mismo que feed.html) -->
<div class="modal fade" id="shareModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="">
        {% csrf_token %}
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">{% trans "Compartir publicación" %}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <textarea name="text" class="form-control" rows="2" maxlength="2000"
                    placeholder="{% trans 'Añade un comentario (opcional)' %}"></textarea>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">{% trans "Cancelar" %}</button>
          <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-share me-1"></i>{% trans "Compartir" %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'JS/social-feed.js' %}?v=1"></script>
{% endblock %}
