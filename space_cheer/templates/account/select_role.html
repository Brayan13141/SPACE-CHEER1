{% extends "core/base.html" %}
{% load i18n %}
{% block content %}
<div class="container py-5">
  <h2>{% trans "Selecciona tu rol" %}</h2>
  <form method="post" action="{% url 'accounts:select_role_submit' %}" id="select-role-form" novalidate>
    {% csrf_token %}
    <div class="d-flex gap-3 mt-4">
      {% for role in roles %}
        <label class="btn btn-outline-light">
          <input type="radio" name="role" value="{{ role.id }}"> {{ role.name }}
        </label>
      {% endfor %}
    </div>
    <div class="sc-feedback text-danger small mt-2" style="display:none;"></div>
    <div class="mt-4">
      <button class="btn btn-primary" type="submit">{% trans "Continuar" %}</button>
    </div>
  </form>
</div>
<script nonce="{{ request.csp_nonce }}">
document.getElementById('select-role-form').addEventListener('submit', function (e) {
    const fb = this.querySelector('.sc-feedback');
    if (!this.querySelector('input[name="role"]:checked')) {
        e.preventDefault();
        fb.textContent = '{% trans "Debes seleccionar un rol para continuar" %}';
        fb.style.display = 'block';
    } else {
        fb.style.display = 'none';
    }
});
</script>
{% endblock %}
