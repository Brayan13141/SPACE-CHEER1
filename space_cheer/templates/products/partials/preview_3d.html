{% load i18n %}
{% comment %}
Partial: previsualización 3D del producto. Requiere `product` en contexto.
Los <script> van en el template padre (block extra_js) — ver product_detail.html.

Pipeline para generar el GLB de un producto (guía para admin):
1. Fotos del producto real (1-4, fondo limpio).
2. Tripo AI (tripo3d.ai) o Meshy.ai → exportar GLB.
3. Opcional: npx @gltf-transform/cli optimize in.glb out.glb --no-compress
4. Subirlo en el formulario del producto (campo "Modelo 3D").
{% endcomment %}

<div class="card shadow-sm mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title mb-0">
      <i class="bi bi-box me-2"></i>{% trans "Vista 3D" %}
      {% if not product.model_3d %}
        <span class="badge bg-secondary ms-1">{% trans "Modelo genérico" %}</span>
      {% endif %}
    </h5>
    <button class="btn btn-sm btn-outline-primary" type="button"
            data-bs-toggle="collapse" data-bs-target="#preview3dCollapse"
            aria-expanded="false" aria-controls="preview3dCollapse">
      <i class="bi bi-chevron-down"></i>
    </button>
  </div>
  <div class="collapse" id="preview3dCollapse"
       data-model-url="{% if product.model_3d %}{{ product.model_3d.url }}{% endif %}">
    <div class="card-body">
      <div id="preview3d-container" class="sc-preview3d"></div>
      <div id="preview3dFallback" class="text-center text-muted py-4 d-none">
        <i class="bi bi-exclamation-triangle d-block mb-2 fs-3"></i>
        <small>{% trans "Tu dispositivo no soporta la vista 3D." %}</small>
        {% if product.image %}
          <img src="{{ product.image.url }}" class="img-fluid rounded mt-2" alt="{{ product.name }}">
        {% endif %}
      </div>
      {% if not product.model_3d %}
      <div class="d-flex gap-2 justify-content-center mt-3" id="preview3dSwatches">
        <button type="button" class="sc-swatch bg-primary" data-color="#2563eb" aria-label="{% trans 'Azul' %}"></button>
        <button type="button" class="sc-swatch bg-danger" data-color="#dc2626" aria-label="{% trans 'Rojo' %}"></button>
        <button type="button" class="sc-swatch bg-success" data-color="#16a34a" aria-label="{% trans 'Verde' %}"></button>
        <button type="button" class="sc-swatch bg-warning" data-color="#eab308" aria-label="{% trans 'Amarillo' %}"></button>
        <button type="button" class="sc-swatch bg-dark" data-color="#1f2937" aria-label="{% trans 'Negro' %}"></button>
        <button type="button" class="sc-swatch sc-swatch-purple" data-color="#7c3aed" aria-label="{% trans 'Púrpura' %}"></button>
      </div>
      <p class="text-center text-muted small mt-2 mb-0">
        {% trans "Modelo ilustrativo. Sube un .glb al producto para ver el modelo real." %}
      </p>
      {% endif %}
    </div>
  </div>
</div>
